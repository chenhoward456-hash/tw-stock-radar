name: 每日 0050 推播

# 純 0050 DCA 策略 — 每日推播兩次
# GitHub Actions cron 整點/半點常延遲 3-5 小時，挑奇怪時間 + 提早當緩衝
#   - 盤中：UTC 01:53（預期 TW 09:53，加延遲後落在 12-14 點）
#   - 盤後：UTC 06:47（預期 TW 14:47，加延遲後落在 16-18 點）

on:
  schedule:
    - cron: '53 1 * * 1-5'   # 盤中快報
    - cron: '47 6 * * 1-5'   # 盤後完整版
  workflow_dispatch:
    inputs:
      mode:
        description: '推播模式'
        required: false
        default: 'close'
        type: choice
        options:
          - close
          - intraday

jobs:
  push_0050:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝依賴
        run: pip install requests pandas numpy yfinance

      - name: 推播 0050
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # cron schedule 用 UTC 時間判斷模式（4 點 = 盤中, 7 點 = 盤後）
          # workflow_dispatch 用 input 判斷
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
          else
            # 判斷模式：用排程的「目標時段」而不是「實際起跑時間」
            # 排程 cron 寫進 GITHUB_EVENT_PATH 的 schedule 欄位
            CRON=$(jq -r .schedule "$GITHUB_EVENT_PATH" 2>/dev/null)
            echo "排程 cron: $CRON"
            if echo "$CRON" | grep -q "53 1"; then
              MODE="intraday"
            else
              MODE="close"
            fi
          fi
          echo "模式：$MODE"
          if [ "$MODE" = "intraday" ]; then
            python notify_0050.py --intraday
          else
            python notify_0050.py
          fi
