name: 每日 0050 推播

# 策略改為純 0050 DCA — 不再掃個股，只推 0050 收盤分析到 Discord
# 原本 notify.py 多股掃描已停用（檔案保留供手動執行）

on:
  schedule:
    # 台灣時間 15:30 收盤後（UTC 07:30），週一到五
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

jobs:
  push_0050:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝依賴
        run: pip install requests pandas numpy yfinance

      - name: 推播 0050 盤後分析
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python notify_0050.py
